name: CI

# Template-internal CI. NOT propagated to consumer projects (sync.sh excludes
# .github/workflows/, asserted by a bats test). Lints the shell scripts and
# runs the bats suites for the enforcement hooks and the sync tool — including
# a leg under macOS bash 3.2 to hold the portability invariant.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck version
        run: shellcheck --version
      - name: Lint shell scripts
        run: make lint

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # test/bats is a submodule
      - name: Tool versions
        run: |
          jq --version
          git --version
          bash --version | head -1
      - name: Run bats suites
        run: make test

  bats-bash32:
    # sync.sh is written to stay portable to macOS bash 3.2. This leg enforces
    # that invariant: macOS ships /bin/bash 3.2.57, but a newer bash sits ahead
    # of it on PATH, so we pin /bin/bash onto PATH and verify before running.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pin the system bash 3.2 onto PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Verify bash is 3.2
        run: |
          bash --version | head -1
          bash --version | head -1 | grep -q 'version 3\.2\.' \
            || { echo "::error::expected bash 3.2 on PATH"; exit 1; }
      - name: Run bats suites under bash 3.2
        run: make test
